<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" font-family="Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#ffffff"/><title>CA3 security</title>
<text x="180" y="26" font-size="17" font-weight="600" fill="#1f2933">CA3: SCHED_DEADLINE privilege boundary</text>
<text x="180" y="44" font-size="11" fill="#52606d">CAP_SYS_NICE (bit 23) in CapEff determines whether sched_setattr can be used</text>
<text x="168" y="102" font-size="12" font-weight="600" fill="#1f2933">privileged</text>
<rect x="180" y="84" width="22" height="22" fill="#0f6e56" rx="4"/>
<text x="212" y="101" font-size="12" fill="#1f2933">CAP_SYS_NICE=1  -&gt;  OK</text>
<text x="168" y="172" font-size="12" font-weight="600" fill="#1f2933">unprivileged</text>
<rect x="180" y="154" width="22" height="22" fill="#b23a2b" rx="4"/>
<text x="212" y="171" font-size="12" fill="#1f2933">CAP_SYS_NICE=0  -&gt;  DENIED_EPERM</text>
<text x="180" y="284" font-size="10" fill="#52606d">unprivileged containers lack bit 23; PERIOD therefore needs --privileged / CAP_SYS_NICE</text>
</svg>
