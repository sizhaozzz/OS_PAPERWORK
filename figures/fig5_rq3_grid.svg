<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440" font-family="Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#ffffff"/><title>RQ3: schedules vs period bound</title>
<text x="78" y="28" font-size="17" font-weight="600" fill="#1f2933">RQ3: schedules to first bug vs period bound (reorder_5)</text>
<text x="78" y="46" font-size="11" fill="#52606d">period=2 finds no bug; period=3 gives 41; period>=4 saturates at 225; d=2 and d=3 identical</text>
<line x1="78" y1="366.0" x2="736" y2="366.0" stroke="#d9e2ec"/>
<text x="70" y="370.0" font-size="11" fill="#52606d" text-anchor="end">0</text>
<line x1="78" y1="302.9" x2="736" y2="302.9" stroke="#d9e2ec"/>
<text x="70" y="306.9" font-size="11" fill="#52606d" text-anchor="end">50</text>
<line x1="78" y1="239.8" x2="736" y2="239.8" stroke="#d9e2ec"/>
<text x="70" y="243.8" font-size="11" fill="#52606d" text-anchor="end">100</text>
<line x1="78" y1="176.7" x2="736" y2="176.7" stroke="#d9e2ec"/>
<text x="70" y="180.7" font-size="11" fill="#52606d" text-anchor="end">150</text>
<line x1="78" y1="113.6" x2="736" y2="113.6" stroke="#d9e2ec"/>
<text x="70" y="117.6" font-size="11" fill="#52606d" text-anchor="end">200</text>
<rect x="120.2" y="359.7" width="40.0" height="6.3" rx="2" fill="#b23a2b"/>
<text x="140.2" y="354.7" font-size="10" fill="#1f2933" text-anchor="middle">0 (no bug)</text>
<rect x="164.2" y="359.7" width="40.0" height="6.3" rx="2" fill="#b23a2b"/>
<text x="184.2" y="354.7" font-size="10" fill="#1f2933" text-anchor="middle">0 (no bug)</text>
<text x="160.2" y="386" font-size="12" fill="#1f2933" text-anchor="middle">period=2</text>
<rect x="284.8" y="314.2" width="40.0" height="51.8" rx="2" fill="#0f6e56"/>
<text x="304.8" y="309.2" font-size="10" fill="#1f2933" text-anchor="middle">41</text>
<rect x="328.8" y="314.2" width="40.0" height="51.8" rx="2" fill="#0f6e56"/>
<text x="348.8" y="309.2" font-size="10" fill="#1f2933" text-anchor="middle">41</text>
<text x="324.8" y="386" font-size="12" fill="#1f2933" text-anchor="middle">period=3</text>
<rect x="449.2" y="82.0" width="40.0" height="284.0" rx="2" fill="#0f6e56"/>
<text x="469.2" y="77.0" font-size="10" fill="#1f2933" text-anchor="middle">225</text>
<rect x="493.2" y="82.0" width="40.0" height="284.0" rx="2" fill="#0f6e56"/>
<text x="513.2" y="77.0" font-size="10" fill="#1f2933" text-anchor="middle">225</text>
<text x="489.2" y="386" font-size="12" fill="#1f2933" text-anchor="middle">period=4</text>
<rect x="613.8" y="82.0" width="40.0" height="284.0" rx="2" fill="#0f6e56"/>
<text x="633.8" y="77.0" font-size="10" fill="#1f2933" text-anchor="middle">225</text>
<rect x="657.8" y="82.0" width="40.0" height="284.0" rx="2" fill="#0f6e56"/>
<text x="677.8" y="77.0" font-size="10" fill="#1f2933" text-anchor="middle">225</text>
<text x="653.8" y="386" font-size="12" fill="#1f2933" text-anchor="middle">period=5</text>
<rect x="78" y="420" width="14" height="12" rx="2" fill="#0f6e56"/>
<text x="98" y="430" font-size="11" fill="#52606d">bug found (d=2)</text>
<rect x="288" y="420" width="14" height="12" rx="2" fill="#2f6f8f"/>
<text x="308" y="430" font-size="11" fill="#52606d">bug found (d=3)</text>
<rect x="498" y="420" width="14" height="12" rx="2" fill="#b23a2b"/>
<text x="518" y="430" font-size="11" fill="#52606d">no bug</text>
</svg>
