<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" font-family="Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#ffffff"/><title>RQ4: SCHED_DEADLINE vs CFS yield cost</title>
<text x="90" y="28" font-size="17" font-weight="600" fill="#1f2933">RQ4: SCHED_DEADLINE scheduling overhead (50 yields, log scale)</text>
<text x="90" y="46" font-size="11" fill="#52606d">each deadline yield costs ~one 20 ms period; ~4,388x (1 thread) and ~2,305x (4 threads) slower than CFS</text>
<line x1="90" y1="330.0" x2="696" y2="330.0" stroke="#d9e2ec"/>
<text x="82" y="334.0" font-size="11" fill="#52606d" text-anchor="end">1e-4 s</text>
<line x1="90" y1="279.6" x2="696" y2="279.6" stroke="#d9e2ec"/>
<text x="82" y="283.6" font-size="11" fill="#52606d" text-anchor="end">1e-3 s</text>
<line x1="90" y1="229.2" x2="696" y2="229.2" stroke="#d9e2ec"/>
<text x="82" y="233.2" font-size="11" fill="#52606d" text-anchor="end">1e-2 s</text>
<line x1="90" y1="178.8" x2="696" y2="178.8" stroke="#d9e2ec"/>
<text x="82" y="182.8" font-size="11" fill="#52606d" text-anchor="end">1e-1 s</text>
<line x1="90" y1="128.4" x2="696" y2="128.4" stroke="#d9e2ec"/>
<text x="82" y="132.4" font-size="11" fill="#52606d" text-anchor="end">1e0 s</text>
<line x1="90" y1="78.0" x2="696" y2="78.0" stroke="#d9e2ec"/>
<text x="82" y="82.0" font-size="11" fill="#52606d" text-anchor="end">1e1 s</text>
<rect x="120.8" y="312.0" width="90.0" height="18.0" rx="2" fill="#0f6e56"/>
<text x="165.8" y="307.0" font-size="11" fill="#1f2933" text-anchor="middle">0.000228 s</text>
<text x="165.8" y="350" font-size="10" fill="#52606d" text-anchor="middle">1 thread / CFS</text>
<rect x="272.2" y="128.4" width="90.0" height="201.6" rx="2" fill="#b23a2b"/>
<text x="317.2" y="123.4" font-size="11" fill="#1f2933" text-anchor="middle">1.00057 s</text>
<text x="317.2" y="350" font-size="10" fill="#52606d" text-anchor="middle">1 thread / DEADLINE</text>
<rect x="423.8" y="297.9" width="90.0" height="32.1" rx="2" fill="#0f6e56"/>
<text x="468.8" y="292.9" font-size="11" fill="#1f2933" text-anchor="middle">0.000434 s</text>
<text x="468.8" y="350" font-size="10" fill="#52606d" text-anchor="middle">4 threads / CFS</text>
<rect x="575.2" y="128.4" width="90.0" height="201.6" rx="2" fill="#b23a2b"/>
<text x="620.2" y="123.4" font-size="11" fill="#1f2933" text-anchor="middle">1.00042 s</text>
<text x="620.2" y="350" font-size="10" fill="#52606d" text-anchor="middle">4 threads / DEADLINE</text>
</svg>
